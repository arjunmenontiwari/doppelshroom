{% extends "base.html" %}
{% block title %}Lost{% endblock %}
{% block content %}
<section class="head lost" data-greet="i'm lost too... this way out?">

    <h1>Lost in the woods</h1>
    <p class="lede">There's no page here. It may have moved, or the link has a typo.</p>
    <p class="fields"><a class="button" href="/">Back to search <span aria-hidden="true">→</span></a> <a class="button ghost" href="/quiz">Take the quiz instead</a></p>
  </div>

    <g class="eyes"><circle cx="12.4" cy="18.4" r=".95"/><circle cx="15.6" cy="18.4" r=".95"/></g>
    <path class="mouth" d="M12.6 21.6q1.4-1 2.8 0"/>
    <path class="cap" d="M2 13C2 3 26 3 26 13Q14 15.5 2 13Z"/>
    <circle class="spot" cx="8" cy="8.5" r="1.6"/><circle class="spot" cx="14.5" cy="6" r="1.3"/><circle class="spot" cx="20" cy="9.5" r="1.5"/>
  </svg>
</section>
{% endblock %}
{% block script %}{% endblock %}
